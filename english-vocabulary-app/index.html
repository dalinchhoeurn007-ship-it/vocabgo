<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VocabGo – Learn English Vocabulary</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Noto+Sans+Khmer:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<aside class="side"><div class="logo"><i class="fa-solid fa-graduation-cap"></i> VocabGo</div><nav id="nav"></nav></aside>
<div class="shade" data-act="menu"></div>
<div class="main">
  <header class="top">
    <button class="icon" data-act="menu" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
    <div class="search"><i class="fa-solid fa-magnifying-glass"></i><input id="gsearch" data-in="gq" placeholder="Search words..."></div>
    <span class="chip" id="streak"></span>
  </header>
  <main id="view"></main>
</div>
<div id="modal" class="modal"></div>
<div id="toast" class="toast"></div>
<script src="js/storage.js"></script>
<script src="js/vocabulary.js"></script>
<script src="js/flashcards.js"></script>
<script src="js/quiz.js"></script>
<script src="js/app.js"></script>
</body>
</html>
